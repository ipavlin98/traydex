[package]
edition = "2024"
name = "gpui-unofficial"
version = "1.25.3"
authors = ["Nathan Sobo <nathan@zed.dev>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Zed's GPU-accelerated UI framework"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = [
    "desktop",
    "gui",
    "immediate",
]
categories = ["gui"]
license = "Apache-2.0"
repository = "https://github.com/gpui-archipelago/gpui-unofficial"

[package.metadata.cargo-shear]
ignored = [
    "getrandom",
    "objc2",
    "objc2-metal",
]
ignored-paths = ["src/_ownership_and_data_flow.rs"]

[features]
bench = ["bench-support"]
bench-support = [
    "profiler",
    "dep:criterion",
]
default = [
    "font-kit",
    "wayland",
    "x11",
    "windows-manifest",
]
font-kit = []
leak-detection = []
profiler = ["dep:hdrhistogram"]
proptest = ["dep:proptest"]
screen-capture = ["scap"]
stacker = ["dep:stacksafe"]
test-support = [
    "collections/test-support",
    "http_client/test-support",
    "wayland",
    "x11",
    "dep:futures-concurrency",
    "dep:postage",
    "dep:web-time",
    "proptest",
]
wayland = []
windows-manifest = ["dep:embed-resource"]
x11 = ["scap?/x11"]

[lib]
name = "gpui"
path = "src/gpui.rs"

[[test]]
name = "action_macros"
path = "tests/action_macros.rs"

